// The native library is built by CMake (preset android-arm64-release, see scripts/build-android.ps1) and
// packaged from build/android-arm64-release/jniLibs. SDL's Java activity is compiled from the SDL sources that
// CMake fetched, so no third-party code is copied into this repository.

plugins {
    id 'com.android.application'
}

def nativeBuild = file("${rootDir}/../build/android-arm64-release")
def sdlJava = file("${nativeBuild}/_deps/sdl3-src/android-project/app/src/main/java")

android {
    namespace = 'com.ff7ccrecomp'
    compileSdk = 36
    ndkVersion = '29.0.14206865'  // used to strip debug info from libmain.so when packaging

    defaultConfig {
        applicationId = 'com.ff7ccrecomp'
        minSdk = 29     // Vulkan 1.1
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            java.srcDirs += [sdlJava]
            jniLibs.srcDirs = ["${nativeBuild}/jniLibs"]
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug  // local builds only; nothing is published
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }

    lint { abortOnError = false }
}

tasks.register('checkNativeBuild') {
    doLast {
        if (!sdlJava.exists() || !file("${nativeBuild}/jniLibs/arm64-v8a/libmain.so").exists())
            throw new GradleException("Build the native library first: scripts/build-android.ps1")
    }
}
preBuild.dependsOn checkNativeBuild
